<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة مذاكرة – الدرس 1-1: تاريخ تكنولوجيا المعلومات (IT)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f7; --surface:#ffffff; --surface2:#e6edf3; --text:#14273b; --muted:#56687a; --border:#d3dde7;
  --primary:#0e7c86; --primary-d:#0a5b63; --primary-soft:#d6eef0; --on-primary:#ffffff; --ink:#16324f;
  --amber:#f2b632; --amber-soft:#fdf0cf; --amber-ink:#7a5600;
  --good:#237a57; --good-soft:#d9f1e5; --bad:#c4423a; --bad-soft:#fae2df;
  --c-intro:#5b6b7f; --c-stages:#0e7c86; --c-moore:#4a5fc1; --c-social:#b7791f;
  --hero-a:#16324f; --hero-b:#0e5c6b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a26; --surface:#172536; --surface2:#1f3146; --text:#e6eef6; --muted:#9db0c3; --border:#2b4058;
    --primary:#2fb0bc; --primary-d:#7bd8e0; --primary-soft:#173a44; --on-primary:#06282c; --ink:#dbe8f5;
    --amber:#f2b632; --amber-soft:#3a3016; --amber-ink:#f5cf7a;
    --good:#4cc38f; --good-soft:#15392c; --bad:#ef7c73; --bad-soft:#41211f;
    --c-intro:#9db0c3; --c-stages:#43c1cc; --c-moore:#8fa0ff; --c-social:#f2b632;
    --hero-a:#0b2236; --hero-b:#0f4a57;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a26; --surface:#172536; --surface2:#1f3146; --text:#e6eef6; --muted:#9db0c3; --border:#2b4058;
  --primary:#2fb0bc; --primary-d:#7bd8e0; --primary-soft:#173a44; --on-primary:#06282c; --ink:#dbe8f5;
  --amber:#f2b632; --amber-soft:#3a3016; --amber-ink:#f5cf7a;
  --good:#4cc38f; --good-soft:#15392c; --bad:#ef7c73; --bad-soft:#41211f;
  --c-intro:#9db0c3; --c-stages:#43c1cc; --c-moore:#8fa0ff; --c-social:#f2b632;
  --hero-a:#0b2236; --hero-b:#0f4a57;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{line-height:1.5;margin:0 0 .4em;font-weight:700}
h1{font-size:clamp(1.55rem,4.2vw,2.35rem);line-height:1.4}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
h4{font-size:1.02rem}
p{margin:0 0 .7em}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
svg.ic{flex:none;vertical-align:middle}
.muted{color:var(--muted)}
.hide{display:none!important}

/* الهيكل */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 6px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:start}
.brand svg{color:var(--primary)}
.brand b{display:block;font-size:1rem;line-height:1.3}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.mini-p{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.mini-p .progress{width:70px;height:8px}
.top-s{flex:1;max-width:300px}
.tabs{max-width:1080px;margin:0 auto;padding:4px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 14px;border-radius:99px;cursor:pointer;font-size:.92rem;font-weight:500;line-height:1.6}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
.page-h{margin-bottom:14px}
.page-h p{margin:0}

/* عناصر عامة */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px}
.card h3{margin-bottom:.5em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:.95rem;cursor:pointer;line-height:1.5;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover:not(:disabled){background:var(--primary-d);border-color:var(--primary-d);color:var(--on-primary)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;min-height:36px;font-size:.88rem}
.btn.big{padding:12px 24px;font-size:1.05rem}
.link{background:none;border:0;color:var(--primary);cursor:pointer;font-weight:600;padding:4px 0;display:inline-flex;align-items:center;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--surface2);color:var(--text);line-height:1.7}
.badge.sec{background:transparent;border:1.5px solid var(--sc);color:var(--sc)}
.badge.on-dark{background:rgba(255,255,255,.16);color:#fff}
.badge.en{font-family:"IBM Plex Sans Arabic",sans-serif;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{border:1.5px solid var(--border);background:var(--surface);color:var(--text);padding:4px 14px;border-radius:99px;cursor:pointer;font-size:.9rem;font-weight:500;line-height:1.7}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip.term{border-color:var(--sc,var(--primary));color:var(--sc,var(--primary));background:transparent;direction:ltr}
.progress{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.callout{border-inline-start:5px solid var(--sc,var(--primary));background:var(--surface);border-radius:12px;padding:14px 18px;margin-bottom:14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-left:1px solid var(--border)}
.callout h3{color:var(--sc,var(--primary));margin-bottom:.3em}
.callout p:last-child{margin-bottom:0}
.key{background:var(--amber-soft);color:var(--text);border:1.5px dashed var(--amber);border-radius:12px;padding:12px 16px;margin:14px 0;display:flex;gap:10px;align-items:flex-start}
.key svg{color:var(--amber-ink);margin-top:6px}
.key b{color:var(--amber-ink)}
.warn{background:var(--bad-soft);border:1.5px solid var(--bad);border-radius:12px;padding:12px 16px;margin:14px 0}
.empty{text-align:center;padding:30px 10px;color:var(--muted);border:2px dashed var(--border);border-radius:14px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:0 12px;min-height:44px;color:var(--muted)}
.searchbox:focus-within{border-color:var(--primary)}
.searchbox input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;font-size:.95rem;min-width:0;outline:none;padding:8px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .searchbox{flex:1;min-width:200px}
.toast{position:fixed;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--surface);padding:8px 20px;border-radius:99px;font-weight:600;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
.toast.on{opacity:1}

/* الرئيسية */
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:20px;padding:26px 28px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center;margin-bottom:14px}
@media(max-width:780px){.hero{grid-template-columns:1fr;padding:20px}}
.hero h1{margin:.4em 0 .3em}
.hero p{color:rgba(255,255,255,.88);max-width:34em}
.hp{margin-top:16px}
.hp .pl{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin-bottom:6px}
.hp .pl b{font-size:1.5rem}
.hero .progress{background:rgba(255,255,255,.2);height:12px}
.hero .progress>i{background:var(--amber)}
.hp small{color:rgba(255,255,255,.75)}
.hero .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.4);margin-top:14px}
.hero .btn:hover{background:rgba(255,255,255,.24);border-color:#fff}
.ruler{width:100%;height:auto;color:rgba(255,255,255,.9)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px}
.stat b{display:block;font-size:1.8rem;line-height:1.3;color:var(--sc,var(--ink))}
.stat span{color:var(--muted);font-size:.9rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.tile{display:flex;gap:14px;align-items:center;text-align:start;background:var(--surface);color:var(--text);border:1px solid var(--border);border-inline-start:6px solid var(--sc,var(--primary));border-radius:14px;padding:14px 16px;cursor:pointer;min-height:76px;width:100%}
.tile:hover{background:var(--surface2)}
.tile b{display:block;font-size:1.05rem;line-height:1.5}
.tile small{color:var(--muted);line-height:1.5;display:block}
.tile-ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--surface2);color:var(--sc,var(--primary));display:grid;place-items:center}
.tile.main{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tile.main small{color:inherit;opacity:.85}
.tile.main .tile-ic{background:rgba(255,255,255,.2);color:inherit}
.tile.main:hover{background:var(--primary-d)}

/* الدراسة */
.mapgroup{margin-bottom:18px}
.mapgroup>h3{display:flex;align-items:center;gap:8px;color:var(--sc);margin-bottom:.6em}
.mapitem{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);color:var(--text);border:1px solid var(--border);border-inline-start:5px solid var(--sc);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.mapitem:hover{background:var(--surface2)}
.mapitem>span:nth-child(2){flex:1}
.mapitem b{display:block;line-height:1.5}
.mapitem small{color:var(--muted);line-height:1.5}
.mi-ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;color:var(--on-primary)}
.mapitem.done .mi-ck{background:var(--good);border-color:var(--good)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;inset-block:22px;inset-inline-start:17px;width:3px;background:var(--border);border-radius:2px}
.tl li{position:relative;padding-inline-start:54px;margin-bottom:10px}
.tl .dot{position:absolute;inset-inline-start:0;top:10px;width:38px;height:38px;border-radius:50%;background:var(--surface);border:3px solid var(--c-stages);display:grid;place-items:center;font-weight:700;color:var(--c-stages);z-index:1}
.tl li.done .dot{background:var(--c-stages);color:var(--on-primary)}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.tl-main{display:block;width:100%;text-align:start;background:none;border:0;color:inherit;cursor:pointer;padding:0;margin-bottom:6px}
.tl-main small{display:block;color:var(--c-stages);font-weight:600;line-height:1.5}
.tl-main b{display:block;line-height:1.6}
.tl-card .chips{margin:0}
.crumb{margin-bottom:8px}
.unit-h{border-inline-start:6px solid var(--sc);padding-inline-start:14px;margin-bottom:16px}
.unit-h h2{margin:.3em 0 .1em}
.unit-h p{margin:0}
.unit-nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px}
.mtl{display:flex;align-items:center;margin:0 0 16px;overflow-x:auto;padding-bottom:4px}
.mtl-i{flex:none;background:none;border:0;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 4px;min-width:66px}
.mtl-i .dot{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.mtl-i small{font-size:.75rem;line-height:1.4}
.mtl-i.done .dot{border-color:var(--c-stages);color:var(--c-stages)}
.mtl-i.on .dot{background:var(--c-stages);border-color:var(--c-stages);color:var(--on-primary)}
.mtl-i.on{color:var(--text);font-weight:700}
.mtl-l{flex:1;min-width:12px;height:3px;background:var(--border);margin-bottom:18px}
.facts{display:grid;gap:10px;margin:0 0 14px}
.fact{display:grid;grid-template-columns:170px 1fr;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
@media(max-width:640px){.fact{grid-template-columns:1fr;gap:2px}}
.fact dt{font-weight:700;color:var(--sc,var(--primary))}
.fact dd{margin:0}
.tcard{background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--sc,var(--primary));border-radius:12px;padding:14px 16px;margin-bottom:12px}
.tcard header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:8px}
.tcard header h4{margin:0}
.tcard .en{color:var(--muted);direction:ltr;font-weight:500}
.tcard dl{margin:0;display:grid;gap:6px}
.tcard dt{font-weight:700;font-size:.88rem;color:var(--sc,var(--primary));line-height:1.6}
.tcard dd{margin:0 0 4px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 4px}
.flow .node{background:var(--surface2);border-radius:10px;padding:6px 14px;font-weight:600;font-size:.92rem}
.flow .node.bad{background:var(--bad-soft);color:var(--bad)}
.flow .arr{color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding:6px 4px 0;margin-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar{width:100%;max-width:64px;background:var(--c-moore);border-radius:8px 8px 3px 3px;opacity:.9}
.bcol b{font-size:.95rem}
.bcol small{color:var(--muted);text-align:center;line-height:1.4;font-size:.78rem}
.shrink{display:flex;align-items:flex-end;justify-content:center;gap:24px;margin:14px 0 6px;flex-wrap:wrap}
.shrink div{border:3px solid var(--primary);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:var(--primary);text-align:center;line-height:1.3}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.vs{grid-template-columns:1fr}}
.vs>div{border-radius:12px;padding:12px 16px;border:1.5px solid var(--border)}
.vs .no{background:var(--bad-soft);border-color:var(--bad)}
.vs .yes{background:var(--good-soft);border-color:var(--good)}
.scard{background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--c-social);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sc-h{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;border:0;color:inherit;cursor:pointer;padding:12px 16px}
.sc-h span.t{flex:1}
.sc-h b{display:block;line-height:1.5}
.sc-h small{color:var(--muted);direction:ltr;display:block;text-align:start;line-height:1.5}
.sc-h svg.chev{transition:transform .2s;color:var(--muted)}
.scard.open .sc-h svg.chev{transform:rotate(-90deg)}
.sc-b{display:none;padding:0 16px 14px}
.scard.open .sc-b{display:block}
.sc-b dl{margin:0;display:grid;gap:4px}
.sc-b dt{font-weight:700;font-size:.88rem;color:var(--c-social);line-height:1.6}
.sc-b dd{margin:0 0 6px}

/* المصطلحات */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gcard{position:relative;text-align:start;background:var(--surface);color:var(--text);border:1px solid var(--border);border-top:4px solid var(--sc);border-radius:12px;padding:12px 14px;cursor:pointer;display:block;width:100%}
.gcard:hover{background:var(--surface2)}
.gcard b{display:block;line-height:1.5;padding-inline-end:30px}
.gcard .en{display:block;color:var(--muted);direction:ltr;text-align:start;font-size:.9rem;line-height:1.5}
.gcard .ab{display:inline-block;margin-top:4px;font-size:.78rem;background:var(--surface2);border-radius:6px;padding:0 8px;direction:ltr}
.gcard .fav{position:absolute;top:8px;inset-inline-end:8px}
.fav{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px;display:inline-grid;place-items:center;min-width:34px;min-height:34px}
.fav.on{color:var(--amber)}
.fav.on svg{fill:currentColor}
.ovl{position:fixed;inset:0;background:rgba(8,18,28,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:60}
.mdl{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:18px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:20px 22px;outline:none}
.mdl-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.mdl-h>div{flex:1}
.mdl-h h3{margin:0;font-size:1.3rem}
.mdl-h .en{color:var(--muted);direction:ltr;text-align:start}
.mdl dl{margin:0;display:grid;gap:4px}
.mdl dt{font-weight:700;font-size:.9rem;color:var(--sc,var(--primary))}
.mdl dd{margin:0 0 8px}
.mdl-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}

/* الأسئلة */
.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qcard{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--sc,var(--primary));border-radius:12px;padding:14px 16px;margin-bottom:10px}
.qn{flex:none;width:32px;height:32px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--muted)}
.qb{flex:1;min-width:0}
.qb .q{font-weight:600;margin-bottom:8px}
.ans{background:var(--surface2);border-radius:10px;padding:10px 14px;margin:10px 0 0}
.ans p{margin:0 0 4px}
.ans.ok{background:var(--good-soft)}
.ans.no{background:var(--bad-soft)}
.ans .verdict{font-weight:700}
.ans.ok .verdict{color:var(--good)}
.ans.no .verdict{color:var(--bad)}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);color:var(--text);border:2px solid var(--border);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:50px;font-size:.98rem;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--primary)}
.opt:disabled{cursor:default;color:var(--text)}
.opt .ol{flex:none;width:30px;height:30px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt>span:not(.ol){flex:1}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}

  return { id: "tm" + t.id, type: "term", s: t.sec, q: `ما المعنى العربي للمصطلح «${t.en}»؟`, options: opts.map(x => x.ar), ans: opts.indexOf(t), exp: `${t.en} = ${t.ar}. ${t.def}` };
}

}
function cmpQs(n) {

  return pick(rows, n).map(({ c, r }, i) => {
    const side = Math.random() < .5 ? 1 : 2, name = side === 1 ? c.a : c.b, right = r[side], other = r[side === 1 ? 2 : 1];
    const pool = Array.from(new Set(rows.filter(o => o.c !== c).flatMap(o => [o.r[1], o.r[2]]).filter(v => v !== right && v !== other)));

  });
}
function poolQ(type, n) {

    case "mcq": return pick(MCQ_R, n).map(mcqQ);

    case "term": return pick(TERMS, n).map(termQ);

function buildQs(kind) {

  if (QCFG.type !== "mixed") return poolQ(QCFG.type, QCFG.n);
  const w = [["mcq", .35], ["tf", .25], ["term", .15], ["illa", .15], ["cmp", .10]];
  const cnt = w.map(x => Math.floor(QCFG.n * x[1])); let rem = QCFG.n - cnt.reduce((a, b) => a + b, 0); for (let i = 0; rem > 0; i = (i + 1) % cnt.length, rem--) cnt[i]++;

}

function calcRes(s) {

/* ===================== البحث العام ===================== */
function vSearch(q) {
  const nq = norm(q), out = [];
  const terms = TERMS.filter(t => norm([t.ar, t.en, t.ab, t.def, t.simple, t.ex, t.key].join(" ")).includes(nq));
  const det = (k, s, q2, a) => `<details class="qd"><summary><span class="badge">${k}</span> ${esc(q2)}</summary><div class="ans">${a}</div></details>`;
  ILLA_V.forEach(x => { if (norm(x.q + " " + x.a).includes(nq)) out.push(det("علل", x.s, "علل: " + x.q, "<b>الإجابة:</b> " + esc(x.a))); });
  TF_V.forEach(x => { if (norm(x.q + " " + x.c + " " + x.e).includes(nq)) out.push(det("صح/خطأ", x.s, x.q, `<b>الإجابة:</b> ${x.a ? "صح" : "خطأ"}${x.a ? "" : "<br><b>التصحيح:</b> " + esc(x.c)}<br>${esc(x.e)}`)); });
  MCQ_V.forEach(x => { if (norm(x.q + " " + x.options.join(" ") + " " + x.e).includes(nq)) out.push(det("اختيار", x.s, x.q, `<b>الإجابة:</b> ${esc(x.options[x.ans])}<br>${esc(x.e)}`)); });
  return `<div class="page-h"><h2>نتائج البحث عن «${esc(q)}»</h2><p class="muted">${terms.length} مصطلح، ${out.length} سؤال</p></div>
  <h3>المصطلحات</h3>${terms.length ? `<div class="gcards">${terms.map(gCard).join("")}</div>` : `<div class="empty">لا توجد مصطلحات مطابقة.</div>`}
  <h3 style="margin-top:18px">الأسئلة</h3>${out.length ? out.slice(0, 40).join("") : `<div class="empty">لا توجد أسئلة مطابقة.</div>`}`;
}

  qtype(el) { QCFG.type = el.dataset.v; route("quiz", true); },
  qn(el) { QCFG.n = +el.dataset.v; route("quiz", true); },
  qstart(el) { const k = el.dataset.kind; startSession(k, buildQs(k), { type: QCFG.type, n: QCFG.n }); route(k); },
  qans(el) { const s = SESS[cur]; if (!s || s.done) return; if (s.kind === "quiz" && s.ans[s.i] !== null) return; s.ans[s.i] = +el.dataset.k; route(cur, true); },
  qnext() { const s = SESS[cur]; if (!s) return; if (s.i < s.qs.length - 1) { s.i++; route(cur); } else if (s.kind === "quiz") finish(cur); },
  qprev() { const s = SESS[cur]; if (s && s.i > 0) { s.i--; route(cur); } },
  qjump(el) { const s = SESS[cur]; if (s) { s.i = +el.dataset.k; route(cur); } },
  qend() {
    const s = SESS[cur]; if (!s) return; const un = s.ans.filter(a => a === null).length;
    if (!un) return finish(cur);
    openModal(`<h3>إنهاء ${s.kind === "exam" ? "الامتحان" : "الاختبار"}؟</h3><p>لم تجب عن <b>${un}</b> سؤالًا. الأسئلة غير المجابة تُحسب خاطئة.</p><div class="mdl-f"><button class="btn" data-act="closeModal">متابعة الحل</button><button class="btn primary" data-act="qfin">إنهاء وعرض النتيجة</button></div>`);
  },
  qfin() { closeModal(); finish(cur); },
  qretake() { const s = SESS[cur]; if (!s) return; if (s.cfg.retry) { startSession(cur, s.qs.map(q => Object.assign({}, q)), s.cfg); } else if (cur === "exam") startSession("exam", buildQs("exam"), {}); else startSession("quiz", buildQs("quiz"), { type: QCFG.type, n: QCFG.n }); route(cur); },
  qwrong() { const s = SESS[cur]; if (!s) return; const r = calcRes(s); const qs = r.items.filter(x => !x.ok).map(x => Object.assign({}, x.q)); SESS.quiz = null; startSession("quiz", qs, { retry: true }); go("quiz"); },
  qreset() { SESS[cur] = null; route(cur); },
  fcflip() { FC.flip = !FC.flip; fcRender(); },
  fcnext() { FC.flip = false; const l = fcList(); FC.i = (FC.i + 1) % Math.max(1, l.length); fcRender(); },
  fcprev() { FC.flip = false; const l = fcList(); FC.i = (FC.i - 1 + l.length) % Math.max(1, l.length); fcRender(); },
  fcshuf() { fcOrder = shuffle(fcOrder); FC.i = 0; FC.flip = false; fcRender(); },
  fcfav(el) { FC.fav = !FC.fav; FC.i = 0; FC.flip = false; el.classList.toggle("primary", FC.fav); fcRender(); }
};
const INP = {
  gsearch(el) { G.q = el.value; glList(); },
  qsearch(el) { QV.q = el.value; qList(); },
  gs(el) { const q = el.value.trim(); if (!q) { if (cur === "search") go("home"); return; } cur = "search"; refreshCur = null; closeModal(); $$(".tab").forEach(t => t.classList.remove("on")); $("#main").innerHTML = vSearch(q); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-act]"); if (!el) return;
  if (el.dataset.go !== undefined && el.dataset.act === undefined) { e.preventDefault(); if (el.disabled) return; go(el.dataset.go || "study"); return; }
  const inner = e.target.closest("[data-act]");
  const a = ACT[inner.dataset.act]; if (!a) return;
  if (inner.dataset.act === "term" && e.target.closest('[data-act="fav"]')) return;
  if (inner.dataset.act === "sc" && e.target.closest('[data-act="fav"]')) return;
  a(inner, e);
});
document.addEventListener("input", e => { const el = e.target.closest("[data-input]"); if (el && INP[el.dataset.input]) INP[el.dataset.input](el); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("gcard")) { e.preventDefault(); termModal(e.target.dataset.id); }
});

/* ===================== البداية ===================== */
function init() {
  $("#tabs").innerHTML = NAV.map(n => `<button class="tab" data-go="${n[0]}">${n[1]}</button>`).join("");
  route((location.hash || "#home").slice(1) || "home");
}
init();

</script>
</body>
</html>
